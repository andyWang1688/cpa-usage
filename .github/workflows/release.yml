name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release source
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m venv .venv
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: .venv/bin/python scripts/package.py /tmp/cpa-usage-release
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" /tmp/cpa-usage-release/* --verify-tag --title "CPA Usage $GITHUB_REF_NAME" --generate-notes
